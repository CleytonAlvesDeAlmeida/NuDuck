# ==========================================================================
# NuDuck — Pipeline de CI no Codemagic
#
# Dois workflows:
#
# 1. android-native-release
#    Build do APK Android (debug). Roda no mac_mini_m2 porque tem Java 17,
#    Android SDK e Gradle pré-instalados.
#
# 2. server-validate
#    Validação do server Python após os Items 1, 2, 3 e 9 (criptografia
#    de QRCode, clonar aparência, perfil LowLatency). Instala o
#    requirements.txt (incluindo cryptography>=42) e roda:
#      - Check de sintaxe Python (ast.parse) em server.py e virtual_display.py
#      - Teste de round-trip do token QR: gera token ND1.<b64>.<b64>,
#        valida de volta, e confirma que um token expirado é rejeitado.
#    Roda em linux instance (mais barato que Mac para tarefas Python).
# ==========================================================================

workflows:

  # ----------------------------------------------------------------------
  # Workflow 1: Build do APK Android (inalterado na estrutura)
  # ----------------------------------------------------------------------
  android-native-release:
    name: Build Android APK Nativo
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Gerar Gradle Wrapper (gradlew não está versionado no repo)
        script: |
          cd android
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Entrar na pasta android e buildar
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  # ----------------------------------------------------------------------
  # Workflow 2: Validação do server Python (Items 1, 2, 3 e 9)
  #
  # Garante que:
  #   - server.py e virtual_display.py têm sintaxe válida
  #   - O pacote `cryptography>=42` (adicionado no Item 3) instala OK
  #   - O round-trip do token QR criptografado funciona (gera → valida → OK)
  #   - Um token expirado é corretamente rejeitado
  #   - A geração de atalhos padrão (Item 1) produz os 3 atalhos esperados
  #
  # Nota: o bloco `environment` do Codemagic NÃO suporta `python` como campo
  # de versão (só aceita java/node/flutter/xcode/cocoapods/vars/groups).
  # Por isso, o Python 3 é instalado explicitamente via apt-get no primeiro
  # script. O Linux instance do Codemagic já vem com python3 pré-instalado,
  # mas garantimos a versão e o pip.
  # ----------------------------------------------------------------------
  server-validate:
    name: Validar Server Python (QR criptografado + atalhos + sintaxe)
    max_build_duration: 30
    instance_type: linux
    environment:
      vars:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_NO_CACHE_DIR: "1"
    scripts:
      - name: Garantir Python 3 e pip disponíveis
        script: |
          # O Linux instance do Codemagic já vem com python3; só garantimos
          # que pip e venv estão disponíveis. Se python3 não existir, instala.
          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y python3 python3-pip python3-venv
          fi
          python3 --version
          python3 -m pip --version || (
            sudo apt-get update -y
            sudo apt-get install -y python3-pip
          )
          # Alias `python` -> `python3` (algumas distros Linux não criam o alias).
          command -v python >/dev/null 2>&1 || sudo ln -sf "$(which python3)" /usr/local/bin/python

      - name: Instalar cryptography (Item 3)
        script: |
          cd server
          python -m pip install --upgrade pip
          # Só precisamos de cryptography para validar a lógica do token QR.
          # As deps pesadas (aiortc, mss, pyautogui) exigem DISPLAY e libs
          # nativas que nem sempre estão disponíveis em runners headless —
          # sua validação acontece no workflow .github/workflows/build-desktop.yml
          # (que roda em Ubuntu/Windows com libs de sistema completas).
          pip install "cryptography>=42"

      - name: Verificar sintaxe Python (ast.parse)
        script: |
          cd server
          python -c "import ast; ast.parse(open('server.py').read()); print('server.py OK')"
          python -c "import ast; ast.parse(open('virtual_display.py').read()); print('virtual_display.py OK')"

      - name: Testar round-trip do token QR criptografado (Item 3)
        script: |
          cd server
          python - <<'PY'
          """
          Testa a LÓGICA do token QR (Item 3) sem importar server.py inteiro
          (que depende de mss/pyautogui não disponíveis em ambiente headless).
          Extrai as constantes via AST e reimplementa as funções de token
          localmente, idênticas ao server.py.
          """
          import ast, base64, json, secrets, time, sys
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          # Lê server.py e extrai as constantes QR_TOKEN_VERSION / TTL.
          tree = ast.parse(open("server.py").read())
          qr_version = "ND1"
          qr_ttl = 30
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name):
                          if t.id == "QR_TOKEN_VERSION":
                              qr_version = ast.literal_eval(node.value)
                          elif t.id == "QR_TOKEN_TTL_SECONDS":
                              qr_ttl = ast.literal_eval(node.value)
          print(f"QR_TOKEN_VERSION={qr_version}, TTL={qr_ttl}s")
          assert qr_version == "ND1"
          assert qr_ttl == 30

          def b64url_encode(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).decode("ascii").rstrip("=")
          def b64url_decode(s: str) -> bytes:
              pad = "=" * (-len(s) % 4)
              return base64.urlsafe_b64decode(s + pad)

          TEST_KEY = secrets.token_bytes(32)
          TEST_PIN = "123456"

          def build_token(pin: str, ttl: int = qr_ttl) -> str:
              host_port = "127.0.0.1:8765"
              host_port_b64 = b64url_encode(host_port.encode())
              payload = json.dumps({
                  "v": 1,
                  "pin": pin,
                  "nonce": secrets.token_hex(8),
                  "exp": int((time.time() + ttl) * 1000),
              }, separators=(",", ":"))
              aesgcm = AESGCM(TEST_KEY)
              nonce = secrets.token_bytes(12)
              ct = aesgcm.encrypt(nonce, payload.encode(), None)
              return f"{qr_version}.{host_port_b64}.{b64url_encode(nonce + ct)}"

          def validate_token(token: str, expected_pin: str):
              if not token.startswith(f"{qr_version}."):
                  return False, ""
              parts = token.split(".", 2)
              if len(parts) != 3:
                  return False, ""
              try:
                  blob = b64url_decode(parts[2])
                  if len(blob) < 12 + 16:
                      return False, ""
                  nonce, ct = blob[:12], blob[12:]
                  aesgcm = AESGCM(TEST_KEY)
                  plaintext = aesgcm.decrypt(nonce, ct, None)
                  data = json.loads(plaintext.decode())
              except Exception:
                  return False, ""
              if int(time.time() * 1000) > int(data.get("exp", 0)):
                  return False, ""
              if data.get("v") != 1:
                  return False, ""
              if str(data.get("pin", "")) != expected_pin:
                  return False, ""
              return True, str(data.get("pin", ""))

          # Round-trip válido.
          token = build_token(TEST_PIN)
          assert token.startswith("ND1."), f"Token não começa com ND1.: {token[:20]}"
          print(f"Token gerado: {token[:60]}...")
          ok, pin = validate_token(token, TEST_PIN)
          assert ok and pin == TEST_PIN, "Token válido rejeitado!"
          print(f"Token validado OK — PIN={pin}")

          # Token lixo.
          ok, _ = validate_token("ND1.lixo.lixo", TEST_PIN)
          assert not ok, "Token lixo aceito!"
          print("Token inválido rejeitado OK")

          # Token expirado.
          ok, _ = validate_token(build_token(TEST_PIN, ttl=-60), TEST_PIN)
          assert not ok, "Token expirado aceito!"
          print("Token expirado rejeitado OK")

          # Token com PIN errado.
          ok, _ = validate_token(token, "999999")
          assert not ok, "Token com PIN errado aceito!"
          print("Token com PIN errado rejeitado OK")

          print("Todos os testes do token QR passaram!")
          PY

      - name: Testar atalhos padrão (Item 1)
        script: |
          cd server
          python - <<'PY'
          """Extrai _DEFAULT_SHORTCUTS do server.py via AST e valida os 3 atalhos."""
          import ast
          tree = ast.parse(open("server.py").read())
          default_shortcuts = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "_DEFAULT_SHORTCUTS":
                          default_shortcuts = ast.literal_eval(node.value)
          assert default_shortcuts is not None, "_DEFAULT_SHORTCUTS não encontrada!"
          print(f"Default shortcuts: {[s['name'] for s in default_shortcuts]}")
          assert len(default_shortcuts) == 3
          names = [s["name"] for s in default_shortcuts]
          assert "Configuração" in names
          assert "Alt+F4" in names
          assert "Multitarefa" in names
          cmds = {s["name"]: s["command"] for s in default_shortcuts}
          assert "DISPLAY=:1 gnome-control-center &" in cmds["Configuração"]
          assert "DISPLAY=:1 xdotool key Alt+F4 &" in cmds["Alt+F4"]
          assert "DISPLAY=:1 xdotool key Super &" in cmds["Multitarefa"]
          print("Atalhos padrão OK!")
          PY

    artifacts:
      # Não há binário pra publicar — este workflow só valida.
      - server/*.log
